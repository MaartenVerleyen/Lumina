<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="irisGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="prismFill" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="prismFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Outer Aperture Ring -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="url(#neonGradient)" stroke-width="3" opacity="0.4"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonGradient)" stroke-width="5" filter="url(#coreGlow)"/>

    <!-- Neural Constellation Web & Nodes -->
    <g opacity="0.65" stroke="url(#neonGradient)" stroke-width="1">
      <line x1="160" y1="160" x2="210" y2="140"/>
      <line x1="210" y1="140" x2="256" y2="110"/>
      <line x1="310" y1="130" x2="350" y2="160"/>
      <line x1="350" y1="160" x2="370" y2="210"/>
      <line x1="370" y1="210" x2="390" y2="260"/>
      <line x1="360" y1="330" x2="320" y2="370"/>
      <line x1="320" y1="370" x2="280" y2="390"/>
      <line x1="180" y1="360" x2="140" y2="310"/>
      <line x1="140" y1="310" x2="130" y2="250"/>
      <line x1="130" y1="250" x2="160" y2="190"/>
      <line x1="210" y1="140" x2="270" y2="170" stroke-opacity="0.5"/>
      <line x1="350" y1="160" x2="320" y2="210" stroke-opacity="0.5"/>
      <line x1="360" y1="330" x2="300" y2="310" stroke-opacity="0.5"/>
      <line x1="180" y1="360" x2="220" y2="320" stroke-opacity="0.5"/>
      <line x1="140" y1="310" x2="190" y2="270" stroke-opacity="0.5"/>
    </g>

    <!-- Neural Dots -->
    <g fill="#38bdf8" filter="url(#coreGlow)">
      <circle cx="160" cy="160" r="3.5"/>
      <circle cx="210" cy="140" r="3"/>
      <circle cx="256" cy="110" r="4" fill="#a7f3d0"/>
      <circle cx="310" cy="130" r="3"/>
      <circle cx="350" cy="160" r="4"/>
      <circle cx="370" cy="210" r="3.5"/>
      <circle cx="390" cy="260" r="4" fill="#34d399"/>
      <circle cx="360" cy="330" r="3"/>
      <circle cx="320" cy="370" r="4"/>
      <circle cx="280" cy="390" r="3.5"/>
      <circle cx="180" cy="360" r="3.5"/>
      <circle cx="140" cy="310" r="4"/>
      <circle cx="130" cy="250" r="3.5"/>
      <circle cx="160" cy="190" r="3"/>
      <circle cx="270" cy="170" r="2.5" fill="#ffffff"/>
      <circle cx="320" cy="210" r="2.5" fill="#ffffff"/>
      <circle cx="300" cy="310" r="2.5" fill="#ffffff"/>
      <circle cx="220" cy="320" r="2.5" fill="#ffffff"/>
      <circle cx="190" cy="270" r="2.5" fill="#ffffff"/>
    </g>

    <!-- 6 Interlocking Aperture Shutter Blades -->
    <path d="M 256 96 C 310 96 360 128 388 174 C 342 186 288 206 244 240 C 236 190 242 136 256 96 Z" fill="none" stroke="url(#neonGradient)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 395 178 C 420 226 420 286 392 334 C 362 298 322 268 268 250 C 310 220 362 194 395 178 Z" fill="none" stroke="url(#neonGradient)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 388 338 C 358 384 310 416 256 416 C 242 376 236 322 244 272 C 288 306 342 326 388 338 Z" fill="none" stroke="url(#irisGradient)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 256 416 C 202 416 152 384 124 338 C 170 326 224 306 268 272 C 276 322 270 376 256 416 Z" fill="none" stroke="url(#neonGradient)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 117 334 C 92 286 92 226 120 178 C 150 214 190 244 244 262 C 202 292 150 318 117 334 Z" fill="none" stroke="url(#irisGradient)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 124 174 C 154 128 202 96 256 96 C 270 136 276 190 268 240 C 224 206 170 186 124 174 Z" fill="none" stroke="url(#neonGradient)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Inner Core Aperture Ring -->
    <circle cx="256" cy="256" r="66" fill="#070c14" stroke="url(#neonGradient)" stroke-width="3.5" filter="url(#coreGlow)"/>

    <!-- Central Lumina Prism -->
    <polygon points="256,198 308,284 204,284" fill="url(#prismFill)" stroke="#67e8f9" stroke-width="2"/>
    <polygon points="256,198 256,284 204,284" fill="url(#prismFacet)" opacity="0.6"/>
    <line x1="256" y1="198" x2="256" y2="284" stroke="#ffffff" stroke-width="2.5" filter="url(#coreGlow)"/>

    <!-- Refraction Ray Sparks -->
    <line x1="256" y1="192" x2="256" y2="182" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="316" y1="288" x2="324" y2="294" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="196" y1="288" x2="188" y2="294" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>