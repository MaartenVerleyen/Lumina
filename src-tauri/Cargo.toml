[package]
name = "Lumina"
version = "5.0.0"
description = "A Local AI supported photo organisation and finder app"
authors = ["Maarten"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photo_triage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = ["crates/lumina-core", "crates/lumina-server"]

[dependencies]
lumina-core = { path = "crates/lumina-core", features = ["tauri"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Client mode (remote.rs, uploads.rs, downloads.rs): the server's API, its events, the session token in the
# system's credential store, and the client's own small database of local copies
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
walkdir = "2.5"

# Tests of the transfer protocol against a stand-in server (transfer.rs)
[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

# Linux: the window plays local videos over HTTP from 127.0.0.1 (media_server.rs)
[target.'cfg(target_os = "linux")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["net"] }
rand = "0.9"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Compile external dependencies (like image decoding) at MAX speed even in 'tauri dev'!
[profile.dev.package."*"]
opt-level = 3
