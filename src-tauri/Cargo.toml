[package]
name = "Lumina"
version = "1.0.0"
description = "A Local AI supported photo organisation and finder app"
authors = ["Maarten"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photo_triage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
blake3 = "1.5"
rayon = "1.10"
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
kamadak-exif = "0.5"
reverse_geocoder = "4.1"
tract-onnx = "0.21"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Compile external dependencies (like image decoding) at MAX speed even in 'tauri dev'!
[profile.dev.package."*"]
opt-level = 3
