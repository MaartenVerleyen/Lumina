[package]
name = "lumina-core"
version = "4.2.0"
description = "Lumina's engine: indexing, metadata, thumbnails, faces and smart search, without any window"
authors = ["Maarten"]
edition = "2024"

[features]
# The desktop app's Host (Tauri's AppHandle); the server builds without it
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
blake3 = "1.5"
kamadak-exif = "0.5"
reverse_geocoder = "4.1"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
trash = "5"
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Graphics_Imaging",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
# The `#[implement]` macro (Recycle Bin progress sink) expands to `::windows_core` paths
windows-core = "0.62"
