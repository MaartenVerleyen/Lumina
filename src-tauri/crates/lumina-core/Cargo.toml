[package]
name = "lumina-core"
version = "4.3.0"
description = "Lumina's engine: indexing, metadata, thumbnails, faces and smart search, without any window"
authors = ["Maarten"]
edition = "2024"

[features]
# The desktop app's Host (Tauri's AppHandle); the server builds without it
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
blake3 = "1.5"
kamadak-exif = "0.5"
reverse_geocoder = "4.1"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
walkdir = "2.5"
base64 = "0.22"
little_exif = "=0.6.23"
notify-debouncer-full = "0.7.0"
reqwest = { version = "0.12", features = ["json"] }
# ONNX Runtime for faces and smart search (pinned: the 2.0 API still changes between release candidates).
# The GPU provider is per system, see the target sections below.
ort = "=2.0.0-rc.15"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
jpeg-decoder = { version = "0.3", default-features = false }
# Accent folding for the search language ("liege" finds Liège), as the frontend does with normalize("NFD")
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Graphics_Imaging",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
# The `#[implement]` macro (Recycle Bin progress sink) expands to `::windows_core` paths
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["cuda"] }

# macOS: ONNX Runtime's prebuilt for Apple Silicon comes with CoreML (there is none for Intel Macs)
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["coreml"] }

[target.'cfg(unix)'.dependencies]
# Local time for file dates (localtime_r)
libc = "0.2"
