[package]
name = "lumina-tray"
version = "6.2.1"
description = "A tray icon for the Lumina server on its own computer: is it running, what it is doing, the admin page"
authors = ["Maarten"]
edition = "2024"

[dependencies]
# The same versions Tauri brings in (already in Cargo.lock)
# Linux shows the icon through libayatana-appindicator (as Tauri does), without libxdo (an extra system library)
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
tao = "0.37"
ureq = "3"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
