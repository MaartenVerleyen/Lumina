[package]
name = "lumina-server"
version = "4.3.0"
description = "Lumina without a window: keeps libraries scanned, with thumbnails, faces and smart search, for clients"
authors = ["Maarten"]
edition = "2024"

[dependencies]
lumina-core = { path = "../lumina-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The same SQLite as the engine (one library.db; the server adds its users and sessions tables)
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
rpassword = "7"
# ServeFile is a tower service, called with oneshot
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The cookie's Max-Age (the cookie crate uses time's Duration)
time = "0.3"

[dev-dependencies]

# Free disk space of the data folder, for the admin page
[target.'cfg(unix)'.dependencies]
libc = "0.2"
