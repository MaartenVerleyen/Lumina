[package]
name = "lumina-server"
version = "4.2.0"
description = "Lumina without a window: keeps libraries scanned, with thumbnails, faces and smart search, for clients"
authors = ["Maarten"]
edition = "2024"

[dependencies]
lumina-core = { path = "../lumina-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
