<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Lumina">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6e6e73; --card: #ffffff; --line: #e5e3de; --accent: #0f9d6e;
    --shade: rgba(0, 0, 0, .92);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d0e12; --fg: #f1f2f4; --muted: #9a9ca3; --card: #16181d; --line: #262931; --accent: #34d399; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  header { max-width: 1400px; margin: 0 auto; padding: 56px 20px 24px; }
  h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; letter-spacing: -.02em; font-weight: 700; }
  .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  .meta a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .meta a:hover { text-decoration: underline; }
  main { max-width: 1400px; margin: 0 auto; padding: 0 20px 60px; }
  /* Justified rows: each photo grows by its width/height ratio */
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid::after { content: ""; flex-grow: 999999; }
  .tile { position: relative; flex-grow: var(--r); flex-basis: calc(var(--r) * 220px); min-width: 0; max-width: 100%; height: 260px; overflow: hidden; border-radius: 10px; background: var(--card); cursor: zoom-in; border: 0; padding: 0; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
  .tile:hover img { transform: scale(1.03); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { .tile { height: 180px; flex-basis: calc(var(--r) * 150px); } header { padding-top: 32px; } }
  #map { height: 380px; border-radius: 14px; margin-top: 32px; border: 1px solid var(--line); }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 20px 40px; }
  /* Lightbox */
  .lb { position: fixed; inset: 0; background: var(--shade); display: none; z-index: 10; color: #f1f2f4; }
  .lb.open { display: flex; flex-direction: column; }
  .lb figure { flex: 1; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 56px 64px 8px; }
  .lb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .lb figcaption { text-align: center; padding: 8px 20px 22px; color: #c9cbd1; min-height: 52px; }
  .lb figcaption b { color: #fff; font-weight: 600; }
  .lb button { position: absolute; background: rgba(255,255,255,.08); color: #fff; border: 0; width: 48px; height: 48px; border-radius: 50%; font-size: 26px; cursor: pointer; display: grid; place-items: center; }
  .lb button:hover { background: rgba(255,255,255,.18); }
  .lb .close { top: 12px; right: 12px; font-size: 22px; }
  .lb .prev { left: 12px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 12px; top: 50%; transform: translateY(-50%); }
  .lb .count { position: absolute; top: 22px; left: 22px; font-size: 13px; color: #9a9ca3; }
  @media (max-width: 640px) { .lb figure { padding: 56px 8px 8px; } .lb .prev, .lb .next { display: none; } }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="meta" id="meta"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="map" hidden></div>
</main>
<footer>Made with Lumina</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo">
  <span class="count" id="lbCount"></span>
  <figure><img id="lbImg" alt=""></figure>
  <figcaption id="lbCap"></figcaption>
  <button class="close" id="lbClose" aria-label="Close">✕</button>
  <button class="prev" id="lbPrev" aria-label="Previous">‹</button>
  <button class="next" id="lbNext" aria-label="Next">›</button>
</div>

<script>
const GALLERY = /*__DATA__*/null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtDate = (d) => {
  if (!d) return "";
  const t = new Date(d.slice(0, 10) + "T12:00:00");
  return isNaN(t) ? "" : t.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
};

// Header line: dates, count, download
const photos = GALLERY.photos;
const dates = photos.map((p) => p.date).filter(Boolean).sort();
const meta = [];
if (dates.length) {
  const a = fmtDate(dates[0]), b = fmtDate(dates[dates.length - 1]);
  meta.push(a === b ? a : `${a} – ${b}`);
}
meta.push(`${photos.length} photo${photos.length === 1 ? "" : "s"}`);
let metaHtml = meta.map((m) => `<span>${esc(m)}</span>`).join("");
if (GALLERY.zip) metaHtml += `<a href="${esc(GALLERY.zip)}" download>Download all</a>`;
document.getElementById("meta").innerHTML = metaHtml;

// The grid
const grid = document.getElementById("grid");
photos.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "tile";
  b.style.setProperty("--r", (p.w / p.h).toFixed(3));
  b.setAttribute("aria-label", p.caption || `Photo ${i + 1}`);
  b.innerHTML = `<img src="${esc(p.thumb)}" alt="${esc(p.caption || "")}" loading="lazy" width="${p.w}" height="${p.h}">`;
  b.addEventListener("click", () => show(i));
  grid.appendChild(b);
});

// Lightbox: arrows, Escape, swipe
const lb = document.getElementById("lb"), img = document.getElementById("lbImg");
let current = 0;
function show(i) {
  current = (i + photos.length) % photos.length;
  const p = photos[current];
  img.src = p.full;
  img.alt = p.caption || "";
  const bits = [];
  if (p.caption) bits.push(`<b>${esc(p.caption)}</b>`);
  const sub = [fmtDate(p.date), p.place, (p.people || []).join(", ")].filter(Boolean).join(" · ");
  if (sub) bits.push(esc(sub));
  document.getElementById("lbCap").innerHTML = bits.join("<br>");
  document.getElementById("lbCount").textContent = `${current + 1} / ${photos.length}`;
  lb.classList.add("open");
  // Preload the next one
  if (photos.length > 1) new Image().src = photos[(current + 1) % photos.length].full;
}
const close = () => lb.classList.remove("open");
document.getElementById("lbClose").onclick = close;
document.getElementById("lbPrev").onclick = () => show(current - 1);
document.getElementById("lbNext").onclick = () => show(current + 1);
lb.addEventListener("click", (e) => { if (e.target === lb || e.target.tagName === "FIGURE") close(); });
document.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowLeft") show(current - 1);
  else if (e.key === "ArrowRight") show(current + 1);
});
let touchX = null;
lb.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
  touchX = null;
});

// Optional map (needs an internet connection for the map itself)
const located = photos.filter((p) => p.lat != null && p.lon != null);
if (GALLERY.map && located.length) {
  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);
  const js = document.createElement("script");
  js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  js.onload = () => {
    const el = document.getElementById("map");
    el.hidden = false;
    const map = L.map(el, { scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap contributors" }).addTo(map);
    const bounds = [];
    located.forEach((p) => {
      const i = photos.indexOf(p);
      L.marker([p.lat, p.lon]).addTo(map).on("click", () => show(i));
      bounds.push([p.lat, p.lon]);
    });
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
  };
  document.head.appendChild(js);
}
</script>
</body>
</html>
