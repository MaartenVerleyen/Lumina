<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body {
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 35%, #131826 0%, #090a0f 75%);
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(16, 185, 129, 0.25);
        border-radius: 16px;
        overflow: hidden;
      }
      .logo-wrap {
        position: relative;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }
      .pulse-ring {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1.5px solid rgba(16, 185, 129, 0.35);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.1); opacity: 0.2; }
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 9999px;
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .subtitle {
        font-size: 12px;
        color: #a1a1aa;
        margin-top: 5px;
      }
      .loader-bar {
        width: 180px;
        height: 4px;
        background: #18181b;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 28px;
        position: relative;
      }
      .loader-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #10b981, #6366f1);
        border-radius: 999px;
        animation: slide 1.25s ease-in-out infinite;
      }
      @keyframes slide {
        0% { left: -45%; }
        100% { left: 100%; }
      }
      .status {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        color: #71717a;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="logo-wrap">
      <div class="pulse-ring"></div>
      <svg width="60" height="60" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="56" height="56" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="2.5"/>
        <circle cx="32" cy="32" r="14" stroke="#34D399" stroke-width="3"/>
        <circle cx="32" cy="32" r="5" fill="#10B981"/>
        <circle cx="44" cy="20" r="3" fill="#6366F1"/>
      </svg>
    </div>
    <div class="title-row">
      <h1>Lumina</h1>
      <span class="badge">v4.1.0</span>
    </div>
    <p class="subtitle">Local AI Photo Culling &amp; Studio Organizer</p>
    <div class="loader-bar">
      <div class="loader-fill"></div>
    </div>
    <span class="status">Initializing SQLite WAL &amp; ONNX Neural Engines...</span>
  </body>
</html>
