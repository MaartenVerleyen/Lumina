# Lumina server and Ollama on one machine with an NVIDIA card (needs the NVIDIA Container Toolkit).
#   docker compose -f server/docker-compose.yml up -d --build
# Then follow it with `docker compose -f server/docker-compose.yml logs -f lumina`.
services:
  lumina:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      # Photo dates taken from file times are shown in this time zone
      TZ: Europe/Brussels
      LUMINA_OLLAMA_URL: http://ollama:11434
      # Uncomment to caption new photos automatically (the model must be pulled in Ollama first:
      # docker compose exec ollama ollama pull qwen3-vl:8b-instruct). The instruct variant answers without
      # reasoning first; on a test set it named fewer things that weren't there than qwen3-vl:8b.
      # LUMINA_CAPTION_MODEL: qwen3-vl:8b-instruct
    volumes:
      # The photo library (read-write: moves, renames and _Trash happen here)
      - /srv/photos:/photos
      # Database, thumbnails, video frames, face crops and AI models
      - lumina-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - ollama

  ollama:
    # Pinned: up to 0.30 Ollama ran the vision encoder on the CPU on any card with 10 GB or less (about 30 s
    # per photo on an 8 GB card); from 0.40 it goes on the GPU when it fits (2-4 s). `latest` also stays
    # whatever was pulled first.
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      # The GPU is shared with Lumina's face and smart search models: let Ollama unload when idle
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  lumina-data:
  ollama:
